name: Auto-merge trusted team PRs into dev

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-dev
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      (
        (
          github.event.pull_request.head.user.login == 'UzairAhmed87' &&
          github.event.pull_request.head.ref == 'uzair' &&
          github.event.pull_request.head.repo.full_name == 'UzairAhmed87/ai-tutor-devmarketplace'
        ) ||
        (
          github.event.pull_request.head.user.login == 'MTahaFarrukh' &&
          github.event.pull_request.head.ref == 'taha' &&
          github.event.pull_request.head.repo.full_name == 'MTahaFarrukh/ai-tutor-devmarketplace'
        ) ||
        (
          github.event.pull_request.head.user.login == 'MSaadalii' &&
          github.event.pull_request.head.ref == 'saad' &&
          github.event.pull_request.head.repo.full_name == 'MSaadalii/ai-tutor-devmarketplace'
        ) ||
        (
          github.event.pull_request.head.user.login == 'Uzzam-100' &&
          github.event.pull_request.head.ref == 'uzzam' &&
          github.event.pull_request.head.repo.full_name == 'Uzzam-100/ai-tutor-devmarketplace'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Merge PR into dev
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash